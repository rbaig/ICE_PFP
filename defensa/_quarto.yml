project:
  type: default
  render:
    # - guio_minutat.qmd
    # - preguntes_tribunal.qmd
    - defensa_EC.qmd      # es renderitza com a revealjs (ho fixa el seu propi front matter)

metadata-files:
  - ../_format-common.yml

# lang i crossref venen de ../_format-common.yml

# Format per defecte dels documents de preparació (el deck l'ignora i usa revealjs).
# HTML és el més pràctic per assajar: emojis i fletxes es renderitzen bé, i cada
# fitxer surt autocontingut.
format:
  html:
    theme: cosmo            # mateix esperit que la memòria
    toc: true
    toc-location: left
    toc-depth: 2
    highlight-style: a11y   # mateixa opció d'accessibilitat que la memòria
    code-copy: true
    embed-resources: true   # un sol .html portàtil, fàcil de compartir o imprimir

  # --- PDF (reaprofita la identitat de la memòria via _format-common.yml) ----
  # Requereix LuaLaTeX + la font "Noto Color Emoji" instal·lada al sistema
  # (Debian/Ubuntu: sudo apt install fonts-noto-color-emoji). Vegeu el README.
  pdf:
    # documentclass, classoption, papersize, fontsize, colorlinks,
    # urlcolor, linkcolor venen de ../_format-common.yml
    geometry:
      - top=2cm
      - bottom=2cm
      - left=2.5cm
      - right=2.5cm
    pdf-engine: lualatex
    include-in-header:
      - text: |
          \usepackage{caption}
          \captionsetup{font=small}
          \usepackage{etoolbox}
          \AtBeginEnvironment{longtable}{\small}
          \AtBeginEnvironment{tabular}{\small}
          % --- Emojis i fletxes Unicode (LuaLaTeX) ---
          % Fallback de font per als glifs que Latin Modern no cobreix (✂️, ⟵, →).
          % Recarreguem la font principal amb el fallback perquè s'apliqui de debò.
          \directlua{luaotfload.add_fallback("ec_emoji", {"NotoColorEmoji:mode=harf;", "DejaVuSans:;"})}
          \setmainfont{Latin Modern Roman}[RawFeature={fallback=ec_emoji}]
